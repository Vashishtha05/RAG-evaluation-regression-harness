[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "A regression harness for measuring retrieval and generation quality in RAG systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
runtime = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]
vector = [
    "faiss-cpu>=1.8",
]
llm = [
    "openai>=1.30",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"